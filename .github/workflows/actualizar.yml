name: Actualizar con el último ICG

on:
  schedule:
    - cron: '17 13 20-31 * *'   # del 20 a fin de mes, 10:17 de Argentina (la Di Tella publica entre el 24 y el 28)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritura-main
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Descargar microdatos de la Di Tella
        run: python scripts/descargar.py fuentes/icg.dta
      - name: Recalcular
        run: |
          python scripts/actualizar.py fuentes/icg.dta
          python scripts/respaldo.py
      - name: Controles
        run: python scripts/verificar.py
      - name: Subir cambios
        run: |
          if git diff --quiet -- datos index.html; then echo "Sin cambios"; exit 0; fi
          MES=$(python -c "import json;print(json.load(open('datos/actual.json'))['mes'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos index.html
          git commit -m "Datos: ICG de $MES"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 15; done; exit 1
